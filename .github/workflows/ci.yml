name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The vitest config defines a browser (Playwright) project for component
      # tests, so make Chromium available even though current tests are node-only.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Run tests
        run: npm test
